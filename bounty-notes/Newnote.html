<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NullNotes - New</title>
</head>
<body>
    <header>

        <h2>NullNotes</h2>

        <hr>
        <nav>
        <a href = "index.html">Home</a>
        <a href = "notes.html">Notes</a>
        <a href = "payload.html">Payloads</a>
        <a href = "Tools.html">Tools</a>
        <a href="Newnote.html">New</a>
        </nav>

    </header>
    <section>

    <h2>+ New Note</h2>
    
    <form class="note-form">

        <label for="title">Title</label>

        <input type="text" id="title"
        placeholder="Type Here...">

        <label for="category">Category</label>

        <select id="category">

            <option>Recon</option>
            <option>XSS</option>
            <option>SQL Injection</option>
            <option>Authentication</option>

        </select>

        <label for="notes">Write Notes</label>

        <textarea id="notes"
        placeholder="Write your recon notes here..."></textarea>

        <button type="button" onclick="saveNote()">
            Save Note
        </button>

    </form>
    </section>
    <section>
        <h2>Saved Notes</h2>
        <div id="Saved-Notes">

        </div>
    </section>
    <script>

function saveNote(){
    let title =
    document.getElementById("title").value;
    let category =
    document.getElementById("category").value;
    let notes =
    document.getElementById("notes").value;
    let savedNotes =
    document.getElementById("Saved-Notes");
    let noteCard = document.createElement("div");

    noteCard.innerHTML = `
        <h3>${title}</h3>
        <p><strong>Category:</strong> ${category}</p>
        <p>${notes}</p>  <hr>`;
    savedNotes.appendChild(noteCard);
}

</script>
</body>
</html>
